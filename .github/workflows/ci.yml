name: CI & Automated Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHONIOENCODING: "utf-8"
  PYTHONUTF8: "1"

jobs:
  test:
    name: Test & Security Audit (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Security & Secret Validator
        run: |
          python scripts/validate.py

      - name: Run Unit & Adversarial Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Token Distillation Benchmark (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          chmod +x bin/huynex-distill
          bin/huynex-distill --benchmark

      - name: Verify Installer Dry-Run (--check)
        run: |
          python scripts/install.py --check

      - name: Verify Installer Lifecycle (Install -> Doctor -> Uninstall)
        run: |
          python scripts/install.py --all
          python scripts/install.py --doctor
          python scripts/install.py --uninstall

      - name: Run Multi-Agent Runtime Integration Smoke Test
        run: |
          python scripts/ci_multi_agent_smoke.py
