name: CI & Automated Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Security Audit (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Security & Secret Validator
        run: |
          python scripts/validate.py

      - name: Run Test Suite (23 Unit & Adversarial Tests)
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Token Distillation Benchmark (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          chmod +x bin/huynex-distill
          bin/huynex-distill --benchmark

      - name: Run System Integrity Doctor
        run: |
          python scripts/install.py --doctor
